# ────────────────────────────────────────────────────────────
# patient-router · БД + приложение
#
#   docker compose up -d --build                 # db + app
#   docker compose --profile dev up dev          # с hot reload
#   docker compose --profile demo up -d demo     # демо с модельным часом
#
# БД:    localhost:5433 · приложение: localhost:8000 · dev: 8001
# демо:  localhost:8010 · docs: /docs
#
# ИМЕНА КОНТЕЙНЕРОВ И ТОМОВ
# ─────────────────────────
# Здесь намеренно НЕТ container_name и верхнеуровневого name: у тома.
# Compose сам даёт контейнерам имена <проект>-<сервис>-1, а тому —
# <проект>_pgdata. Хардкод ломал стенд: вторая копия каталога или
# соседний проект падали с
#   Conflict. The container name "/pr-db" is already in use
#   WARN volume "pr_pgdata" already exists but was created for project ...
# Имя проекта задаётся флагом -p, а не содержимым файла.
# ────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patient_router}
      POSTGRES_USER: ${POSTGRES_USER:-pr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr_local_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init-скрипты НЕ подключены: БД поднимается пустой.
      # Схему накатываем Alembic-миграциями.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pr} -d ${POSTGRES_DB:-patient_router}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-patient_router}
      POSTGRES_USER: ${POSTGRES_USER:-pr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr_local_dev}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      USE_MODEL_CLOCK: ${USE_MODEL_CLOCK:-false}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        # ждём не просто старта, а успешного pg_isready
        condition: service_healthy
    restart: unless-stopped

  # ── demo: прод-образ + модельное время, одна команда ──────
  #
  # Ключевая фишка для жюри (прокрутка 30 суток за секунды) не должна
  # требовать правки .env: у sudo на машине жюри сбрасывается окружение
  # (env_reset), поэтому `sudo -E docker compose up` был единственным
  # способом включить USE_MODEL_CLOCK, и обычный `docker compose up` давал
  # 409 CLOCK_NOT_MOCK. Здесь значение жёстко задано в compose, а порт
  # свой (8010), чтобы не драться с app на 8000.
  #
  # Единственный сервис, который сам накатывает миграции при старте:
  # это одноразовый стенд, иначе жюри получит 500 на первом же
  # POST /api/v1/demo/clock/advance (в БД нет таймеров).
  demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-patient_router}
      POSTGRES_USER: ${POSTGRES_USER:-pr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr_local_dev}
      ENVIRONMENT: prod
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # жёстко true: никакой подстановки извне, sudo -E не нужен
      USE_MODEL_CLOCK: "true"
      TZ: ${TZ:-Europe/Moscow}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${DEMO_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── dev: то же приложение, но с hot reload ───────────────
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-patient_router}
      POSTGRES_USER: ${POSTGRES_USER:-pr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr_local_dev}
      ENVIRONMENT: dev
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      USE_MODEL_CLOCK: ${USE_MODEL_CLOCK:-true}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # свой порт: при `docker compose --profile dev up` поднимается и app,
      # иначе оба бьются за 8000 и стенд не поднимается
      - "${DEV_PORT:-8001}:8000"
    volumes:
      # исходники монтируются, зависимости живут в образе
      - ./app:/app/app
      - ./infra:/app/infra:ro
      # матрица маршрутизации — тоже данные: монтируем read-only,
      # чтобы правка routing_matrix.json подхватывалась без пересборки.
      # В prod-образ config запечён на этапе сборки (см. Dockerfile).
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # без name: том называется <проект>_pgdata и не конфликтует с чужими стендами
  pgdata: