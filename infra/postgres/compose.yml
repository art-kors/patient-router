# ────────────────────────────────────────────────────────────
# patient-router · отдельный стенд только для БД
#
#   cd infra/postgres && docker compose up -d
#
# Это НЕ продолжение корневого docker-compose.yaml, а самостоятельный
# стенд: он поднимает БД с эталонной схемой и сидами из ./init.
# Корневой compose поднимает пустую БД, которую накатывают миграциями.
#
# ИМЕНА КОНТЕЙНЕРОВ И ТОМОВ
# ─────────────────────────
# Намеренно НЕТ container_name и верхнеуровневого name: у тома.
# Compose даёт контейнерам имена <проект>-<сервис>-1, а тому —
# <проект>_pgdata, где проект — имя каталога (или -p). Хардкод рушил
# стенд при любой второй копии:
#   Conflict. The container name "/pr-db" is already in use
#   WARN volume "pr_pgdata" already exists but was created for project ...
# Связь db-init → db идёт по имени СЕРВИСА (db) внутри сети compose,
# поэтому container_name ей и не был нужен.
# ────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patient_router}
      POSTGRES_USER: ${POSTGRES_USER:-pr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr_local_dev}
      # ru_RU не нужен: БД хранит только технические строки
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ↑ персистентность: переживает пересоздание контейнера
      - ./init:/docker-entrypoint-initdb.d:ro
      # ↑ схема + сиды применяются один раз при первом старте
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pr} -d ${POSTGRES_DB:-patient_router}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────
  # Одноразовый сервис: применить init-скрипты к уже существующей БД
  # Нужен, когда volume уже инициализирован, а скрипты изменились:
  #   docker compose --profile tools run --rm db-init
  # ────────────────────────────────────────────────────────────
  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-pr_local_dev}
    volumes:
      - ./init:/init:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /init/*.sql; do
          echo "→ applying $$f"
          psql -h db -U "${POSTGRES_USER:-pr}" -d "${POSTGRES_DB:-patient_router}" \
               -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "✓ init scripts applied"
    profiles: ["tools"]
    restart: "no"

volumes:
  # без name: том называется <проект>_pgdata
  pgdata: